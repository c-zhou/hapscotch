{% set version = "0.1" %}

package:
  name: hapscotch
  version: {{ version }}

source:
  - git_url: https://github.com/c-zhou/hapscotch.git
    git_rev: main

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - make
  host:
    - zlib
  run:
    - python >=3.8
    - numpy
    - matplotlib-base
    - samtools
    - fastga >=1.5.20260729   # FastGA v1.5.1, needed for ALNplot -G
    - bwa-mem2
    - minibwa
    - yahs
    - ghostscript             # ps2pdf, used by ALNplot for PDF output

test:
  commands:
    - hapscotch --help 2>&1 | grep -qi usage
    - hapcure --help 2>&1 | grep -qi usage
    - hictools --help 2>&1 | grep -qi usage
    - seqtools --help 2>&1 | grep -qi usage
    - hapcount --help 2>&1 | grep -qi usage
    - alnsplit --help 2>&1 | grep -qi usage
    - which run_pipeline.py selfaln.py hicaln.py hicmap.py
    - which FastGA ALNchain ALNplot bwa-mem2 minibwa samtools yahs ps2pdf

about:
  home: https://github.com/c-zhou/hapscotch
  license: MIT
  license_file: LICENSE
  summary: Haplotype resolved polyploid genome scaffolding
  description: |
    HapScotch phases and scaffolds haplotypes in polyploid/multi-haplotype
    genome assemblies from all-vs-all sequence self-alignments, optionally
    refined with Hi-C data (contig error-correction and Hi-C-guided
    rescaffolding via YaHS). This package builds hapscotch, hapcure,
    hictools, seqtools, hapcount and alnsplit, plus the scripts/run_pipeline.py
    driver, and pulls in FastGA, bwa-mem2, minibwa, samtools, YaHS and
    ghostscript as runtime dependencies so the whole pipeline works out of the box.

extra:
  recipe-maintainers:
    - c-zhou
