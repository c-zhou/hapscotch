# Sets up a conda environment with everything needed to build and run the
# whole HapScotch pipeline (build toolchain + FastGA/minibwa/samtools/YaHS +
# ghostscript for the alignment plot PDF + the Python packages used by scripts/hicmap.py). Does NOT build hapscotch
# itself - after activating, still run `make` (and optionally `make install`)
# as usual.
#
#   conda env create -f recipes/environment.yml
#   conda activate hapscotch
#   git submodule update --init --recursive   # fetch HiGHS, if not already done
#   make
#
# To build hapscotch as an installable conda package instead (bundling it and
# all of the above into one `conda install`-able package), see recipes/conda/.
name: hapscotch
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.8
  - numpy
  - matplotlib-base
  - make
  - cmake
  - zlib
  - c-compiler
  - cxx-compiler
  - git
  - samtools
  - fastga >=1.5.20260729   # FastGA v1.5.1, needed for ALNplot -G
  - bwa-mem2
  - minibwa
  - yahs
  - ghostscript             # ps2pdf, used by ALNplot for PDF output
